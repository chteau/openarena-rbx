[package]
name = "oaconv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Converts OpenArena 0.8.8 data (vendor/) into Roblox-ready assets (build/)"

# Standalone: the repo root is not a Cargo workspace.
[workspace]

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rayon = "1"
# Open Cloud uploads (Model, Decal) and the key lookup rbx-native already does.
rbx_cloud = { path = "/mnt/data/Documents/Dev/rbx-native/crates/rbx_cloud" }
# Audio uploads: rbx_cloud wraps Model/Decal only, so the multipart POST for Audio is ours.
ureq = { version = "3", features = ["json"] }

[profile.release]
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
